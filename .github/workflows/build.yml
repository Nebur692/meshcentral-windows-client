name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ui_filter:
        description: Only these UI tests (dotnet test --filter) / Solo estas pruebas de interfaz
        required: false
        default: ''

permissions:
  contents: read

jobs:
  integration:
    name: Core + integration (real MeshCentral in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Pull images
        run: |
          docker pull ghcr.io/ylianst/meshcentral:latest
          docker pull mcr.microsoft.com/dotnet/sdk:10.0
          docker pull debian:12-slim
      # The agents the test server hands out, kept between runs (tests/server/fetch-agents.mjs checks each one).
      # Los agentes que da el servidor de pruebas, guardados entre pasadas (tests/server/fetch-agents.mjs comprueba cada uno).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/agentcache
          key: meshtest-agents-${{ runner.os }}-${{ github.run_id }}
          restore-keys: meshtest-agents-${{ runner.os }}-
      - name: Tests
        run: tests/server/run-integration.sh "$RUNNER_TEMP/mctest"
        env:
          MESHTEST_AGENT_CACHE: ${{ runner.temp }}/agentcache

  windows:
    name: Windows tests + single-file app
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Windows tests (unit only; integration runs on Linux)
        run: dotnet test MeshCentralClient.slnx -c Release --filter "Category!=Integration&Category!=UI" --logger "console;verbosity=normal"
      - name: Publish
        run: dotnet publish src/MeshCentralClient.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out
      # The per-user installer around that same exe (installer/MeshCentralClient.iss), then tried as a person would.
      # El instalador por usuario con ese mismo exe, y luego probado como lo haría una persona.
      - name: Installer
        shell: pwsh
        run: |
          $v = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=$v" "/DFileVersion=$($v -replace '-.*$', '')" "/DSourceExe=$PWD\out\MeshCentralClient.exe" "/O$PWD\out" installer\MeshCentralClient.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MCC_VERSION=$v" >> $env:GITHUB_ENV
      - name: Installer test
        shell: pwsh
        timeout-minutes: 5
        run: tests/installer/test-installer.ps1 -Setup "$PWD\out\MeshCentralClient-Setup.exe" -Version $env:MCC_VERSION
      - uses: actions/upload-artifact@v5
        with:
          name: MeshCentralClient-win-x64
          path: |
            out/MeshCentralClient.exe
            out/MeshCentralClient-Setup.exe
          if-no-files-found: error

  ui:
    name: End-to-end UI (real MeshCentral + Windows agent)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish the app
        run: dotnet publish src/MeshCentralClient.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out
      - name: Publish the same app as version 99 (for the self-update test)
        run: dotnet publish src/MeshCentralClient.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version=99.0.0 -o out99
      # The agents the test server hands out, kept between runs (tests/server/fetch-agents.mjs checks each one).
      # Los agentes que da el servidor de pruebas, guardados entre pasadas (tests/server/fetch-agents.mjs comprueba cada uno).
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/agentcache
          key: meshtest-agents-${{ runner.os }}-${{ github.run_id }}
          restore-keys: meshtest-agents-${{ runner.os }}-
      - name: UI test
        shell: pwsh
        env:
          MESHTEST_AGENT_CACHE: ${{ runner.temp }}/agentcache
          MESHUI_FILTER: ${{ inputs.ui_filter }}
        run: tests/ui/run-ui-test.ps1 -Exe "$PWD\out\MeshCentralClient.exe" -Exe99 "$PWD\out99\MeshCentralClient.exe" -Work "$env:RUNNER_TEMP\meshui"
      - name: Server log on failure
        if: failure()
        shell: pwsh
        run: Get-Content "$env:RUNNER_TEMP\meshui\mc.log" -Tail 60 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/meshui/shots
          if-no-files-found: warn

  release:
    name: Publish the release (tags v*, only if everything passed)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [integration, windows, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag must match the version and have its notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          [ "$tag" = "v$version" ] || { echo "tag $tag != v$version (Directory.Build.props)"; exit 1; }
          [ -s "docs/releases/$tag.md" ] || { echo "missing docs/releases/$tag.md"; exit 1; }
      - uses: actions/download-artifact@v5
        with:
          name: MeshCentralClient-win-x64
          path: dist
      - name: Fingerprint
        run: |
          cd dist
          sha256sum MeshCentralClient.exe > MeshCentralClient.exe.sha256
          sha256sum MeshCentralClient-Setup.exe > MeshCentralClient-Setup.exe.sha256
          cat ./*.sha256
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag like v1.2.3-beta.1 is a prerelease: the app never offers those, nor is it the "latest" release.
        # Una etiqueta como v1.2.3-beta.1 es una versión de prueba: la app nunca las ofrece, ni es la última publicada.
        run: |
          case "${GITHUB_REF_NAME}" in *-*) pre=--prerelease ;; *) pre= ;; esac
          # Every release page links the privacy policy. / Cada versión enlaza la política de privacidad.
          { cat "docs/releases/${GITHUB_REF_NAME}.md"; printf '\n---\n\n[Privacy policy / Política de privacidad](https://github.com/%s/blob/main/docs/PRIVACY.md)\n' "${GITHUB_REPOSITORY}"; } > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/MeshCentralClient.exe dist/MeshCentralClient.exe.sha256 dist/MeshCentralClient-Setup.exe dist/MeshCentralClient-Setup.exe.sha256 --title "${GITHUB_REF_NAME}" --notes-file notes.md $pre
